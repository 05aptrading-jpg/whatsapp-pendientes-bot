<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablero de Pendientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen font-sans">
    <!-- Pantalla de acceso (solo correos autorizados) -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-white rounded-lg shadow p-6">
        <h1 class="text-xl font-semibold text-gray-800 mb-1">Tablero de Pendientes</h1>
        <p class="text-sm text-gray-500 mb-5">Acceso restringido. Inicia sesión con tu correo autorizado.</p>
        <form id="loginForm" class="space-y-3" novalidate>
          <div>
            <label class="block text-xs text-gray-600 mb-1" for="loginEmail">Usuario o correo</label>
            <input id="loginEmail" type="text" required autocomplete="username"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm" placeholder="ej. adrianportillo" />
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1" for="loginPassword">Contraseña</label>
            <input id="loginPassword" type="password" required autocomplete="current-password"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm" placeholder="••••••••" />
          </div>
          <button type="submit" id="loginBtn"
            class="w-full bg-blue-600 text-white px-3 py-2 rounded text-sm hover:bg-blue-700">
            Entrar
          </button>
        </form>
        <p id="loginError" class="text-xs text-red-600 mt-3 hidden"></p>
      </div>
    </div>

    <!-- Aplicación (oculta hasta autenticar) -->
    <div id="app" class="hidden">
    <header class="bg-white border-b border-gray-200 px-4 py-4 sticky top-0 z-10 flex items-center justify-between">
      <h1 class="text-lg sm:text-xl font-semibold text-gray-800">Tablero de Pendientes</h1>
      <button id="logoutBtn" class="text-xs text-gray-500 hover:text-gray-800 border border-gray-300 rounded px-2 py-1">Salir</button>
    </header>

    <main class="p-3 sm:p-4 max-w-7xl mx-auto space-y-4 sm:space-y-6">
      <!-- KPIs: la grilla ES el contenedor de las tarjetas -->
      <section id="kpis" aria-label="KPIs" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></section>

      <!-- Filtros -->
      <section class="bg-white rounded-lg shadow p-3 sm:p-4 flex flex-wrap items-center gap-2 sm:gap-3" aria-label="Filtros">
        <div id="statusFilters" class="flex flex-wrap gap-2 w-full sm:w-auto"></div>
        <label class="text-sm text-gray-600 flex items-center gap-2">
          Grupo
          <select id="groupFilter" class="border border-gray-300 rounded px-2 py-1 text-sm max-w-[10rem] sm:max-w-none"></select>
        </label>
        <input
          id="searchInput"
          type="search"
          placeholder="Buscar código o problema..."
          class="border border-gray-300 rounded px-3 py-1.5 text-sm flex-1 min-w-[10rem]"
        />
        <button
          id="exportBtn"
          class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700 disabled:opacity-50 w-full sm:w-auto"
        >
          Exportar CSV
        </button>
      </section>

      <!-- Grupos monitoreados (colapsable, solo admin) -->
      <section id="groupsSection" class="bg-white rounded-lg shadow hidden" aria-label="Grupos monitoreados">
        <button
          id="toggleGroupsBtn"
          type="button"
          class="w-full flex items-center justify-between p-3 sm:p-4 text-left hover:bg-gray-50 rounded-t-lg"
          aria-expanded="true"
          aria-controls="groupsBody"
        >
          <span class="flex items-center gap-2">
            <svg id="groupsChevron" class="h-5 w-5 text-gray-500 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
            <span>
              <span class="block text-base font-semibold text-gray-800">Grupos monitoreados</span>
              <span id="groupsSummary" class="block text-xs text-gray-500">Marca los grupos a vigilar. Se aplica en ~20 s tras guardar.</span>
            </span>
          </span>
          <span id="groupsBadge" class="text-xs text-gray-500"></span>
        </button>

        <div id="groupsBody" class="px-3 sm:px-4 pb-3 sm:pb-4">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-3">
            <div class="flex flex-wrap items-center gap-2">
              <span id="groupsCount" class="text-xs text-gray-500"></span>
              <span id="groupsDirty" class="text-xs text-amber-600 font-medium hidden">● Sin guardar</span>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <input
                id="groupSearchInput"
                type="search"
                placeholder="Buscar grupo..."
                class="border border-gray-300 rounded px-2 py-1 text-sm flex-1 sm:flex-none min-w-[8rem]"
              />
              <button
                id="saveGroupsBtn"
                class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                disabled
              >
                Guardar
              </button>
            </div>
          </div>
          <div id="groupsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 max-h-72 sm:max-h-80 overflow-y-auto pr-1">
            <p class="text-sm text-gray-400">Cargando grupos...</p>
          </div>
          <p id="groupsError" class="text-xs text-red-600 mt-2 hidden"></p>
        </div>
      </section>

      <!-- Tabla (scroll horizontal en móvil; en escritorio columnas completas) -->
      <section class="bg-white rounded-lg shadow overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left min-w-[720px]">
            <thead class="bg-gray-100 border-b">
              <tr>
                <th class="px-3 sm:px-4 py-3 font-medium text-gray-600">Código</th>
                <th class="px-3 sm:px-4 py-3 font-medium text-gray-600">Estado</th>
                <th class="px-3 sm:px-4 py-3 font-medium text-gray-600">Grupo</th>
                <th class="px-3 sm:px-4 py-3 font-medium text-gray-600">Involucrado</th>
                <th class="px-3 sm:px-4 py-3 font-medium text-gray-600">Problema principal</th>
                <th class="px-3 sm:px-4 py-3 font-medium text-gray-600">Creación</th>
                <th class="px-3 sm:px-4 py-3 font-medium text-gray-600">Cierre</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="p-8 text-center text-gray-400">
          No hay pendientes para los filtros seleccionados.
        </div>
      </section>
    </main>

    </div><!-- /#app -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
